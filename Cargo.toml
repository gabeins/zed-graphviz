[package]
name = "zed_dot"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/dot.rs"
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
zed_extension_api = "0.7.0"
