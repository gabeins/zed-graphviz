name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: Extension (wasm32-wasip2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 -- -D warnings
      - run: cargo build --release --target wasm32-wasip2
      # The download checks (checksum, unpacking) are plain Rust.
      - run: cargo test

  # The artifact names in this file end in -ci: the release workflow runs
  # this workflow too, and artifact names must be unique within one run.
  graphviz-wasm:
    name: Build graphviz.wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore graphviz.wasm
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/graphviz-wasm/graphviz.wasm
            server/graphviz-wasm/graphviz.wasm.sha256
          key: graphviz-wasm-${{ hashFiles('server/graphviz-wasm/build.sh', 'server/graphviz-wasm/patches/**') }}
      - name: Build graphviz.wasm
        if: steps.cache.outputs.cache-hit != 'true'
        run: server/graphviz-wasm/build.sh
        env:
          JOBS: 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphviz-wasm-ci
          path: |
            server/graphviz-wasm/graphviz.wasm
            server/graphviz-wasm/graphviz.wasm.sha256
          if-no-files-found: error
          retention-days: 7

  server-lint:
    name: Preview server (format and lints)
    needs: graphviz-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphviz-wasm-ci
          path: server/graphviz-wasm
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  server-test:
    name: Preview server tests (${{ matrix.os }})
    needs: graphviz-wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphviz-wasm-ci
          path: server/graphviz-wasm
      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install graphviz --yes --no-progress
          printf '%s\n' 'C:\Program Files\Graphviz\bin' >> "$GITHUB_PATH"
      - run: dot -V
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - name: Test (bundled Graphviz and system dot)
        run: cargo test --locked
      - name: Test (system dot only)
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features
